
<div class="popup-root">

  <div class="popup-overlay" (click)="fecharPopup()"></div>

  <section class="popup-dialog" role="dialog" aria-modal="true">

    <button
      class="popup-close"
      type="button"
      aria-label="Fechar"
      (click)="fecharPopup()">
      &times;
    </button>

    <div class="login-card">

      <div class="brand">
        <img src="/original/imagem/logo.png" alt="Super Mais">
      </div>

      @if (!mostrarCadastro) {

        <div id="login-view">

          <h1>Olá, Cliente!</h1>
          <p class="subtitle">Entre na sua conta para continuar</p>

          <form (ngSubmit)="fazerLogin()">

            <label for="login-email">E-mail</label>

            <div class="input-wrap">
              <span>✉</span>
              <input
                id="login-email"
                name="email"
                type="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                [(ngModel)]="email"
                required>
            </div>

            <label for="login-password">Senha</label>

            <div class="input-wrap">
              <span>🔒</span>
              <input
                id="login-password"
                name="senha"
                [type]="mostrarSenha ? 'text' : 'password'"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                [(ngModel)]="senha"
                required>

              <button
                type="button"
                id="password-toggle"
                (click)="alternarSenha()"
                aria-label="Mostrar ou ocultar senha">
                {{ mostrarSenha ? '🙈' : '◉' }}
              </button>
            </div>

            <div class="form-options">

              <label class="remember">
                <input type="checkbox">
                <span>Lembrar de mim</span>
              </label>

              <a href="#" (click)="esqueciSenha($event)">
                Esqueci minha senha
              </a>

            </div>

            <button class="btn-green" type="submit">
              Entrar
            </button>

          </form>

          <div class="register">
            Não possui uma conta?
            <a href="#" (click)="abrirCadastro($event)">
              Criar uma conta
            </a>
          </div>

          <div class="divider">
            <span>ou continue com</span>
          </div>

          <div class="social-buttons">
            <button type="button" class="social-btn">
              <strong>G</strong> Google
            </button>

            <button type="button" class="social-btn">
              <strong></strong> Apple
            </button>
          </div>

        </div>

      } @else {

        <div id="register-view">

          <h1>Criar sua conta</h1>
          <p class="subtitle">Preencha seus dados para começar.</p>

          <form (ngSubmit)="criarConta()">

            <label for="register-name">Nome completo</label>

            <div class="input-wrap">
              <span>👤</span>
              <input
                id="register-name"
                name="nome"
                type="text"
                placeholder="Digite seu nome completo"
                autocomplete="name"
                [(ngModel)]="nome"
                required>
            </div>

            <label for="register-email">E-mail</label>

            <div class="input-wrap">
              <span>✉</span>
              <input
                id="register-email"
                name="emailCadastro"
                type="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                [(ngModel)]="emailCadastro"
                required>
            </div>

            <label for="register-password">Senha</label>

            <div class="input-wrap">
              <span>🔒</span>
              <input
                id="register-password"
                name="senhaCadastro"
                type="password"
                placeholder="Crie uma senha"
                minlength="6"
                autocomplete="new-password"
                [(ngModel)]="senhaCadastro"
                required>
            </div>

            <label for="register-password-confirm">
              Confirmar senha
            </label>

            <div class="input-wrap">
              <span>🔒</span>
              <input
                id="register-password-confirm"
                name="confirmarSenha"
                type="password"
                placeholder="Digite a senha novamente"
                minlength="6"
                autocomplete="new-password"
                [(ngModel)]="confirmarSenha"
                required>
            </div>

            <button class="btn-green" type="submit">
              Criar conta
            </button>

          </form>

          <div class="register-back">
            Já possui uma conta?
            <a href="#" (click)="voltarLogin($event)">
              Voltar para o login
            </a>
          </div>

        </div>

      }

    </div>

  </section>

</div>
