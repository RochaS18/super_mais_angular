<div class="carrinho-fundo" hidden="" id="carrinho-fundo">
<aside aria-labelledby="titulo-carrinho" aria-modal="true" class="carrinho-popup" role="dialog">
<button aria-label="Fechar carrinho" class="fechar-carrinho" type="button">×</button>
<h2 id="titulo-carrinho">Meu carrinho</h2>
<div id="itens-carrinho">
<p class="carrinho-vazio">Seu carrinho está vazio.</p>
</div>
<div class="cupom-carrinho">
<label for="cupom">Cupom de desconto</label>
<div>
<input id="cupom" placeholder="Ex.: SUPER10" type="text"/>
<button id="aplicar-cupom" type="button">Aplicar</button>
</div>
<small aria-live="polite" id="mensagem-cupom"></small>
</div>
<div class="resumo-carrinho">
<p><span>Subtotal</span><strong id="subtotal-carrinho">R$ 0,00</strong></p>
<p><span>Desconto</span><strong id="desconto-carrinho">R$ 0,00</strong></p>
<div class="total-carrinho">
<span>Total</span>
<strong id="total-carrinho">R$ 0,00</strong>
</div>
</div>
<button class="finalizar-carrinho" type="button">Finalizar compra</button>
</aside>
</div>
