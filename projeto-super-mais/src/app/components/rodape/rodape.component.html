<section class="bottom-section">

  <!-- APP -->
  <article class="app-card">

    <div class="app-content">
      <h2>
        Cuide da sua rotina
        <span>com o App SuperMais</span>
      </h2>

      <p>Encontre produtos de higiene com praticidade.</p>

      <div class="app-buttons">
        <a routerLink="/" class="store-button">
          <span class="store-icon"><img src="/original/higiene/icone/Apple-Logo.png" alt="" aria-hidden="true"></span>
          <span>
            <small>Disponível na</small>
            App Store
          </span>
        </a>

        <a routerLink="/" class="store-button">
          <span class="store-icon"><img src="/original/higiene/icone/Google-Play.png" alt="" aria-hidden="true"></span>
          <span>
            <small>Disponível no</small>
            Google Play
          </span>
        </a>
      </div>
    </div>

    <div class="app-phone">
      <img src="/original/higiene/imagem/logo_celular.png" alt="Aplicativo SuperMais">
    </div>

  </article>

  <!-- BENEFÍCIOS -->
  <section class="benefits">
    @for (beneficio of beneficios; track beneficio.titulo) {
      <article class="benefit">
        <div class="benefit-icon" [class]="beneficio.classeIcone">
          <img [src]="beneficio.icone" alt="" aria-hidden="true">
        </div>

        <div>
          <h3>{{ beneficio.titulo }}</h3>
          <p>{{ beneficio.texto }}</p>
        </div>
      </article>
    }
  </section>

</section>
