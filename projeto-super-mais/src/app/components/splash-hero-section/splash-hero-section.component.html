<section class="hero-section">
<!-- BANNER -->
<article aria-label="Carrossel de categorias" class="banner" tabindex="0">
<div class="banner-content">
<button aria-label="Slide anterior" class="slider-arrow slider-left" type="button">
<img alt="" aria-hidden="true" src="/original/icone/seta_esquerda_icone.png"/>
</button>
<div class="banner-text">
<h1 class="banner-title">
                            Qualidade e economia
                            <span>em um só lugar!</span>
</h1>
<p class="banner-description">
                            Ofertas imperdíveis em todos os setores
                            para facilitar o seu dia a dia.
                        </p>
<a class="main-button" href="#">
<span class="banner-action-text">Ver ofertas</span>
<span class="button-arrow"><img alt="" aria-hidden="true" src="/original/icone/seta-direita_longa_B_icone.png"/></span>
</a>
</div>
<div class="banner-image">
<img alt="Produtos de supermercado" src="/original/imagem/carinho_alimentos.png"/>
</div>
<button aria-label="Próximo slide" class="slider-arrow slider-right" type="button">
<img alt="" aria-hidden="true" src="/original/icone/seta_direita_icone.png"/>
</button>
</div>
<div aria-label="Navegação do banner" class="slider-dots">
<button aria-label="Ir para Alimentos" class="active-dot" type="button"></button>
<button aria-label="Ir para Doces e Sobremesas" type="button"></button>
<button aria-label="Ir para Ferramentas e Construção" type="button"></button>
<button aria-label="Ir para Higiene e Limpeza" type="button"></button>
</div>
</article>
<!-- OFERTA DO DIA -->
<aside class="daily-offer">
<h2>Oferta do dia</h2>
<div class="offer-content">
<button aria-label="Oferta anterior" class="offer-arrow left" type="button">
<img alt="" aria-hidden="true" src="/original/icone/seta_esquerda_icone.png"/>
</button>
<div class="offer-image">
<img alt="Arroz Branco" src="/original/imagem/arroz_5_kg.png"/>
</div>
<div class="offer-info">
<h3>Arroz Branco</h3>
<p class="product-type">
                            Tipo 1 - 5kg
                        </p>
<div class="price">
<small>R$</small>
                            22,90
                        </div>
<p class="old-price">
                            R$ 29,90
                        </p>
<span class="discount">
                            23% OFF
                        </span>
</div>
<button aria-label="Próxima oferta" class="offer-arrow right" type="button">
<img alt="" aria-hidden="true" src="/original/icone/seta_direita_icone.png"/>
</button>
</div>
<div class="offer-progress">
<div class="progress-bar">
<span></span>
</div>
<small>
                        Oferta válida até 23:59:59
                    </small>
</div>
